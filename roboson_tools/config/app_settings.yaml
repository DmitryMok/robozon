# Настройки приложения по умолчанию.

stl_dir: "assets/stl"

# Разрешение растра силуэта/сечения (px по большей стороне bounding box объекта).
raster_resolution_px: 1024

# Порог круглости.
roundness_threshold: 0.8

# "Проверить модель" — число сечений реконструкции формы по длине объекта.
model_check_samples: 50

# "Проверить модель" — шаг перебора направлений оси переката (полусфера), градусы.
axis_step_deg: 5.0

# Camera Mode (перспективная проекция, см. silhouette/camera.py) — параметры РЕАЛЬНОЙ камеры:
# 2592×1944, объектив без дисторсии, FOV 68°, global shutter. Общие на весь риг (все камеры
# физически одинаковые) — угол+дистанция КАЖДОЙ камеры задаются отдельно, см.
# config/camera_rig_presets.yaml / core/camera_rig.py.
# 68° — вдоль ленты (ось X/roll, направление движения объекта); именно эта ось определяет,
# когда объект входит/выходит из кадра. FOV по поперечной оси не задаётся отдельно — пиксели
# квадратные, поперечный FOV получается автоматически из соотношения сторон сенсора
# (2*atan(tan(34°)*1944/2592) ≈ 54°). ВАЖНО: если в даташите камеры 68° — диагональный FOV,
# значение нужно пересчитать на длинную сторону сенсора.
camera_fov_deg: 68.0
# Разрешение сенсора реальной камеры: [вдоль ленты (строки кадра), поперёк (столбцы)].
# Камера монтируется ДЛИННОЙ стороной вдоль ленты — максимум параллакса по движению товара.
# int вместо пары по-прежнему поддерживается (квадратный кадр, старое поведение).
camera_resolution_px: [2592, 1944]
# Супсемплинг силуэтов Camera Mode (см. silhouette/camera.build_silhouette): растеризация на
# сетке в S раз мельче + усреднение в мягкую маску покрытия — граница локализована с точностью
# ~1/S px вместо ±0.5px бинарной маски (главный источник ошибки на маленьких в кадре объектах).
# На реальной камере ту же роль играет субпиксельная локализация границы по градациям серого.
camera_supersample: 3
