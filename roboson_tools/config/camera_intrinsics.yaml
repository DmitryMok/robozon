# Интринсики реальной камеры для solvePnP (roboson_tools/pose/camera_pose.py::load_camera_intrinsics).
# Этап 1: дисторсия не учитывается (dist_coeffs: null) — линза считается идеальной pinhole.
# Заполняется вручную по результатам калибровки камеры (например, cv2.calibrateCamera по
# шахматной доске), сделанной вне этого инструмента.
#
# resolution_px — под тестовые фото 640x480 (пока настройки реальной камеры на 1280x720 не
# выставлены — см. заметку задачи). cx/cy — точный центр этого кадра. fx/fy — ПОКА ГРУБАЯ
# ПРИКИДКА (не калибровка!) под ~56° горизонтальный FOV, заменить на реально откалиброванные
# значения (например, cv2.calibrateCamera по шахматной доске), когда дойдёт очередь.
fx: 600.0
fy: 600.0
cx: 320.0
cy: 240.0
resolution_px: [480, 640]  # (rows, cols) — должно совпадать с реальным разрешением фото
dist_coeffs: null
