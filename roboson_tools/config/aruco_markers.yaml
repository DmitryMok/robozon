# Раскладка ArUco-меток в мировых координатах (мм) — roboson_tools/pose/marker_layout.py::load_marker_layout.
#
# ВАЖНО: порядок 4 точек в corners_mm — top-left, top-right, bottom-right, bottom-left, КАК
# МЕТКА НАПЕЧАТАНА (в её собственной локальной ориентации), а не как её видно с конкретного
# кадра — так же, как cv2.aruco.ArucoDetector.detectMarkers возвращает углы. Перепутанный
# порядок даёт неверную/неоднозначную позу без явной ошибки при загрузке.
#
# ID меток должны быть уникальны по ВСЕЙ сцене — группировка ниже по "boards" только для
# удобства чтения/обмера, в рантайме используется плоский словарь id -> 4 угла
# (load_marker_layout проверяет уникальность и падает при дубликате).
#
# ТЕКУЩЕЕ СОДЕРЖИМОЕ — печатный тестовый лист `assets/aruco_test_sheet/` (id 20, 21, плоский
# лист Z=0), используется для проверки диалога "Фото с реальной камеры..." реальными снимками
# ДО сборки физического рига. Когда рига будет готова (доска на зеркале + доска по бортам
# ленты), заменить на реально обмеренные координаты обеих досок — конвенция мировых координат
# на усмотрение при обмере, но для последующей 3D-реконструкции рекомендуется X вдоль ленты,
# как и в остальной части roboson_tools (см. docs/method.md).
dictionary: DICT_4X4_50
boards:
  - name: test_sheet  # assets/aruco_test_sheet/aruco_test_sheet.pdf — печатный лист A4
    markers:
      - id: 20
        corners_mm:
          - [30.0, 120.0, 0.0]
          - [75.0, 120.0, 0.0]
          - [75.0, 165.0, 0.0]
          - [30.0, 165.0, 0.0]
      - id: 21
        corners_mm:
          - [135.0, 120.0, 0.0]
          - [180.0, 120.0, 0.0]
          - [180.0, 165.0, 0.0]
          - [135.0, 165.0, 0.0]
