# Геометрия участка и параметры работы (метры, секунды, радианы).
# Оси: X — вдоль потока (точка появления -> конец ленты A), Y — поперёк
#   (Y+ к зоне B), Z — вверх.
#
# Исполнительный механизм: два поворотных шибера (plow diverter) над лентой A.
# Товар всегда остаётся на приводной ленте до момента отклонения: развёрнутый
# щит диагонально перекрывает ленту, лента прижимает товар к щиту, и он
# соскальзывает вбок. Оба шибера убраны (по умолчанию) -> товар едет прямо
# и падает с конца ленты в кейдж C (негабарит).

work_zone: {length_x: 10.0, width_y: 6.0}

belt_a:                 # подающий + сортировочный конвейер (3 физических сегмента)
  width: 0.5
  speed: 1.0
  segments:
    - name: low          # появление товаров, стандартная высота
      x_start: 0.5
      length: 2.0
      height: 0.70
      border_height: 0.05  # бортики против скатывания вбок при случайном
                            # наклоне спавна (до шиберов — им боковой выход
                            # ещё не нужен, см. flat_conveyor_node)
    - name: ramp         # подъём до высоты кейджей C/D
      x_start: 2.5
      length: 1.0
      height_start: 0.70
      height_end: 0.82
    - name: high         # рабочий участок шиберов, конец -> кейдж C
      x_start: 3.5
      length: 4.25
      height: 0.82

spawn:                  # появление объектов (на первом, низком сегменте)
  x: 0.9
  # Ориентация при появлении — случайная (любая ось, включая "вверх ногами",
  # см. random_orientation() в supervisor_main.py). z считается из неё же:
  # под конкретный выпавший поворот, чтобы объект не появлялся под лентой.
  z_margin: 0.02         # дополнительный запас сверх точки соприкосновения
  min_interval_s: 0.5    # минимальный интервал между объектами на ленте

cv_rig:                 # риг компьютерного зрения «3 камеры + 1 зеркало» (5 ракурсов)
                        # Параметры камер (FOV/разрешение) — из roboson_tools/config/
                        # app_settings.yaml. Оси: X — вдоль ленты, Y — поперёк, Z — вверх.
                        # Азимут θ вокруг X: v_θ = (0, cos θ, sin θ) — направление взгляда,
                        # камера в точке distance·v_θ относительно точки наблюдения.
                        #
                        # Схема (Фаза 1 плана "План CV-пайплайна сортировки (Webots)",
                        # заведена задачей "Рассчитать геометрию 3-камерного рига и зеркала
                        # для CV (CV-пайплайн Webots)", числа — roboson_tools/
                        # mirror_rig_geometry.py + docs/mirror_geometry_calc_3cam.md):
                        # top (90°, сверху) + diag (70°, наклонная) + side (0°, сбоку).
                        # Зеркало отражает ТОЛЬКО top и diag (решение пользователя,
                        # side зеркального отражения не имеет — иначе в top/diag кадр не
                        # попадут одновременно и объект, и его отражение).
                        #
                        # Геометрия зеркала — НЕ подбор, задана физическим макетом
                        # пользователя (0 свободных параметров):
                        #  1. зеркало — с ПРОТИВОПОЛОЖНОЙ от side-камеры стороны (side на
                        #     +Y при угле 0° -> зеркало на -Y);
                        #  2. нижний край смещён от КРОМКИ ленты (belt_a.width=0.5, кромка
                        #     на Y=-0.25) ещё на 0.3м дальше, на высоте поверхности ленты
                        #     (Z=0 в этой системе) -> нижний край Y=-0.550, Z=0;
                        #  3. верхняя точка отклонена от вертикали на 23°, В СТОРОНУ ОТ
                        #     ЛЕНТЫ (не нависает козырьком, как в старой 2-камерной схеме).
                        # mirror_normal_deg/mirror_offset — стандартная запись плоскости
                        # (n·p=t, n=(sinφ,-cosφ)), выведены из условий 1-3 выше.
                        # mirror_bottom_edge/mirror_lean_sign — те же условия 2-3 в форме,
                        # удобной для отрисовки КОНЕЧНОЙ пластины в gen_world.py (формула
                        # "ближайшая точка плоскости к точке наблюдения", которая работала
                        # для старой симметричной схемы, для этой геометрии оказалась ВНЕ
                        # видимого полотна зеркала — использовать её для позиции пластины
                        # нельзя, см. doc §3).
                        #
                        # ВАЖНО: 2φ-θ — закон отражения НАПРАВЛЕНИЯ луча (верен только при
                        # t=0), а НЕ азимут смещённой (t≠0) зеркальной камеры от объекта —
                        # проверено на этой геометрии, расхождение ~20° (см. doc §2). Углы
                        # ниже (mirror_distance_by_angle) — TRUE azimuth (точечное
                        # отражение реальной позиции камеры через плоскость зеркала), не
                        # 2φ-θ. При этом угле формула d·v_θ и ПОВОРОТ (θ-90° вокруг X) —
                        # ТА ЖЕ формула, что у прямых камер — уже даёт камеру, направленную
                        # точно на объект (проверено эмпирически захватом кадра). Отдельное
                        # построение ориентации через reflect_dir/восстановление собственной
                        # тройки осей — было опробовано и ОТБРОШЕНО: отражение направления
                        # реальной камеры целится мимо объекта на ~1.3м (тот же класс
                        # ошибки, что 2φ-θ для азимута). Флип картинки тоже не нужен: эти
                        # cv_*_mirror камеры — обычные Webots Camera в точке, вычисленной
                        # методом мнимого изображения, а не физическая оптика зеркала
                        # (объект-зеркало ниже — декоративная пластина, Webots её оптику не
                        # моделирует) — флип актуален только для реальных фото через
                        # настоящее зеркало (roboson_tools/pose/reflect_camera_frame), не
                        # для этого синтетического рендера. Подробности и находка — заметка
                        # задачи "Рассчитать геометрию 3-камерного рига и зеркала для CV".
  x: 3.70                # точка наблюдения (центр зоны CV на высоком сегменте ленты A)
  belt_z: 0.82           # высота поверхности ленты в зоне CV (= высота высокого сегмента)
  fov_deg: 68.0          # угол обзора вдоль ленты (оси X)
  resolution: [2592, 1944]   # [строки (вдоль ленты), столбцы (поперёк)]
  mirror_distance_by_angle:  # оптический путь камера→зеркало→объект, м (по TRUE azimuth)
    157.26: 2.5706   # top (90°) -> top_mirror
    171.95: 2.6943   # diag (70°) -> diag_mirror
  mirror_normal_deg: 113.0    # пеленг ЛИНИИ зеркала в плоскости Y-Z (от оси Y)
  mirror_offset: 0.5063  # |t|: расстояние от точки наблюдения до плоскости зеркала вдоль
                          # нормали, м (для расчёта mirror_distance_by_angle/true azimuth;
                          # НЕ использовать для позиции пластины — см. mirror_bottom_edge)
  mirror_bottom_edge: [-0.550, 0.0]   # [Y, Z] нижнего края полотна, м (условие 1-2 выше)
  mirror_tilt_from_vertical_deg: 23.0   # наклон верхней точки от вертикали (условие 3)
  mirror_lean_sign: -1   # знак направления наклона по Y при подъёме (та же сторона, что
                          # mirror_bottom_edge[0] — "в сторону от ленты")
  cameras:
    # name — имя устройства в Webots (Camera name="cv_<name>").
    # angle — азимут θ в плоскости Y-Z (0°=сбоку +Y, 90°=сверху +Z); для mirror-камер —
    #         TRUE azimuth (см. выше), не 2φ-θ.
    # distance — дистанция прямого ракурса, м (только для прямых камер).
    # mirror: true -> виртуальная камера в отражённой позиции (mirror_distance_by_angle[angle]).
    # reflects — имя прямой камеры, чьё отражение эта mirror-камера эмулирует (нужно для
    #            построения ориентации через reflect_dir, см. заметку задачи).
    top:         {angle: 90, distance: 2.000, mirror: false}   # вид сверху (прямая)
    diag:        {angle: 70, distance: 1.900, mirror: false}   # наклонная (прямая), только момент "центр"
    side:        {angle: 0,  distance: 1.100, mirror: false}   # вид сбоку (прямая)
    top_mirror:  {angle: 157.26, mirror: true, reflects: top}    # top через зеркало
    diag_mirror: {angle: 171.95, mirror: true, reflects: diag}   # diag через зеркало
  mirror_size: [1.6, 0.02, 0.8]   # [длина вдоль X, толщина бруска, высота] — рамка-ориентир
                                    # (не сплошная пластина — см. cv_mirror_node; горизонтальная
                                    # ориентация 160x80см, решение пользователя 2026-07-19,
                                    # было 0.6x1.4 портретной сплошной пластиной, перекрывавшей
                                    # обзор зеркальным камерам)
  mirror_frame_bar_width: 0.03    # ширина бруска рамки, м

diverters:              # поворотные шиберы (вертикальная ось, RotationalMotor)
  arm_length: 1.15
  arm_thickness: 0.03
  arm_height: 0.35
  arm_tilt: 0.0         # щит вертикальный (по требованию); было 0.20 — наклон верхом на объект
  z_bottom: 0.823       # низ щита — сразу над лентой (высокий сегмент 0.82 + 3мм)
  anchor_y: 0.30        # |y| оси поворота (за краем ленты)
  deploy_angle: 0.52    # рад (30°): при α > 45° боковой прижим меньше трения о ленту — клин
  motor_velocity: 4.0
  positions:            # side: -1 — ось справа (y<0), толкает влево к B (+y)
    B: {x: 6.45, side: -1}
    D: {x: 4.95, side: 1}
  trigger_x: 2.70        # линия упреждения: развернуть шибер до прихода объекта (перед D)
  release_timeout_s: 45.0  # увеличено: путь до зоны B теперь длиннее (раструб + лента B)
  nudge_after_s: 1.0    # объект замер у шибера -> пошевелить щит (чаще: без наклона щита толчок слабее)
  nudge_angle: 0.15     # амплитуда, рад

belt_b:                 # приёмный конвейер зоны B — перпендикулярно ленте A
  width: 0.5
  height: 0.70
  speed: 1.0
  x_center: 7.250        # центр по X (совпадает с узкой частью раструба)
  y_start: 0.600         # стык с раструбом
  y_end: 2.500

zone_b_chute:            # статический раструб перед лентой B (без привода, скольжение)
  y_start: 0.255          # 5мм от края ленты A
  y_end: 0.600
  height_start: 0.82      # совпадает с высоким сегментом ленты A
  height_end: 0.70        # совпадает с высотой ленты B
  x_right: 7.500          # правая стенка прямая по всей длине зоны B (255 -> 2500)
  width_start: 1.200      # ширина раструба у входа (пол = ширина стенок, без расширения)
  width_end: 0.500        # ширина после сужения (= ширина ленты B)

roll_cage:               # ролл-кейджи (1200x800x800 мм)
  length: 1.2
  width: 0.8
  height: 0.8
  wall_thickness: 0.02
  positions:
    # C — негабарит: в конце ленты A, на той же оси (Y=0), ловит товар "в лоб".
    # closed: true -> все 4 стенки (лента A выше стенки на 20мм, товар
    # проезжает над кромкой по инерции и падает внутрь).
    C: {x: 8.155, y: 0.0, yaw: 3.14159, closed: true}
    # D — доупаковка: сбоку от ленты A (снизу, -Y).
    # closed: true — 4 стенки по требованию (вид приёмного бокса).
    # Боковой заезд шибером цеплялся за кромку 4-й стенки (в отличие от C,
    # где заезд прямой и объект перелетает стенку по инерции) — компенсируем
    # козырьком d_entry_ramp ниже.
    D: {x: 5.600, y: -0.72, yaw: 1.5708, closed: true}

d_entry_ramp:            # наклонный козырёк-скат над 4-й (входной) стенкой
                         # кейджа D — только над самой стенкой, не заходит
                         # вглубь бокса (иначе мешает вывозить кейдж). x-диапазон
                         # (по всей длине бокса, за вычетом боковых стенок)
                         # считается в gen_world.py из roll_cage/positions.D.
                         #
                         # Подбирайте наклон здесь через y_end/z_end:
                         #   - входная стенка D (текущие positions.D/roll_cage):
                         #     y от -0.34 (внутр. грань) до -0.32 (внешн. грань),
                         #     верх стенки z = 0.80.
                         #   - y_end должен быть НЕ ГЛУБЖЕ ~-0.36..-0.40 (чуть за
                         #     стенкой) — глубже скат уже перекрывает объём бокса
                         #     и мешает его вывозить.
                         #   - z_end должен быть НЕ НИЖЕ 0.80 (верх стенки) —
                         #     ниже скат "утонет" в стенке.
  y_start: -0.25         # кромка ленты A (= -belt_a.width / 2), не менять
  z_start: 0.814         # вровень с лентой, не менять
  y_end: -0.32           # <- подобрать (конец ската по Y)
  z_end: 0.805           # <- подобрать (высота ската в конце, >= 0.80)
  thickness: 0.005

zones:                  # области фиксации доставки — засчитывается по факту
                         # пересечения стенки бокса/лотка, прилегающей к
                         # конвейеру (enter: ось, порог), в пределах её
                         # ширины (lateral: ось, lo, hi). Высота намеренно не
                         # проверяется: иначе штабель товаров в одном боксе
                         # не даёт верхним засчитаться, хотя они уже на месте.
  B: {enter: [y, ">=", 1.60], lateral: [x, 7.00, 7.50]}
  C: {enter: [x, ">=", 7.80], lateral: [y, -0.55, 0.55]}
  D: {enter: [y, "<=", -0.33], lateral: [x, 3.95, 5.25]}

http:
  port: 8008            # панель управления и API
  stream_port: 1234     # streaming-сервер Webots (x3d)

physics:
  basic_time_step_ms: 8
  paddle_friction: 0.05 # гладкий щит шибера: объект соскальзывает вдоль него
