# Геометрия участка и параметры работы (метры, секунды, радианы).
# Оси: X — вдоль потока (точка появления -> конец ленты A), Y — поперёк
#   (Y+ к зоне B), Z — вверх.
#
# Исполнительный механизм: два поворотных шибера (plow diverter) над лентой A.
# Товар всегда остаётся на приводной ленте до момента отклонения: развёрнутый
# щит диагонально перекрывает ленту, лента прижимает товар к щиту, и он
# соскальзывает вбок. Оба шибера убраны (по умолчанию) -> товар едет прямо
# и падает с конца ленты в кейдж C (негабарит).

work_zone: {length_x: 10.0, width_y: 6.0}

belt_a:                 # подающий + сортировочный конвейер (3 физических сегмента)
  width: 0.5
  speed: 1.0
  segments:
    - name: low          # появление товаров + зона CV, стандартная высота
      x_start: 0.5
      length: 3.15        # было 2.0 — CV-зона перенесена сюда, см. [[Расчёт перекладки CV-зоны и ramp]]
      height: 0.70
      border_height: 0      # убран совсем (было 0.05, потом 0.025) — не мешает
                            # side-камере (angle=5°, почти вдоль ленты). Раньше
                            # здесь ошибочно числилось "без бортика дрейф до 1.67м" —
                            # это была ошибка методики теста (мерили |y| без остановки
                            # на границе ramp, поймали ШТАТНУЮ развозку шиберами вбок
                            # в конце ленты, а не соскальзывание в low-сегменте).
                            # Исправленный тест (|y| только пока x < ramp.x_start=3.65,
                            # весь тестовый набор, случайные ориентации спавна) —
                            # максимум 0.05м на 16 объектах, с большим запасом до края
                            # (0.25м) — бортик тут физически не нужен.
    - name: ramp         # подъём до высоты кейджей C/D
      x_start: 3.65        # было 2.5 — сдвинут к шиберу D
      length: 1.0
      height_start: 0.70
      height_end: 0.82
    - name: high         # рабочий участок шиберов, конец -> кейдж C
      x_start: 4.65        # было 3.5 — следствие сдвига ramp
      length: 3.10          # было 4.25 — общая длина ленты A сохранена (7.75)
      height: 0.82

spawn:                  # появление объектов (на первом, низком сегменте)
  x: 0.9
  # Ориентация при появлении — случайная (любая ось, включая "вверх ногами",
  # см. random_orientation() в supervisor_main.py). z считается из неё же:
  # под конкретный выпавший поворот, чтобы объект не появлялся под лентой.
  z_margin: 0.02         # дополнительный запас сверх точки соприкосновения
  min_interval_s: 0.5    # минимальный интервал между объектами на ленте

cv_rig:                 # риг компьютерного зрения «3 камеры + 1 зеркало» (5 ракурсов)
                        # Параметры камер (FOV/разрешение) — из roboson_tools/config/
                        # app_settings.yaml. Оси: X — вдоль ленты, Y — поперёк, Z — вверх.
                        # Азимут θ вокруг X: v_θ = (0, cos θ, sin θ) — направление взгляда,
                        # камера в точке distance·v_θ относительно точки наблюдения.
                        #
                        # Схема (Фаза 1 плана "План CV-пайплайна сортировки (Webots)",
                        # заведена задачей "Рассчитать геометрию 3-камерного рига и зеркала
                        # для CV (CV-пайплайн Webots)", числа — roboson_tools/
                        # mirror_rig_geometry.py + docs/mirror_geometry_calc_3cam.md):
                        # top (90°, сверху) + diag (70°, наклонная) + side (0°, сбоку).
                        # Зеркало отражает ТОЛЬКО top и diag (решение пользователя,
                        # side зеркального отражения не имеет — иначе в top/diag кадр не
                        # попадут одновременно и объект, и его отражение).
                        #
                        # Геометрия зеркала — НЕ подбор, задана физическим макетом
                        # пользователя (0 свободных параметров):
                        #  1. зеркало — с ПРОТИВОПОЛОЖНОЙ от side-камеры стороны (side на
                        #     +Y при угле 0° -> зеркало на -Y);
                        #  2. нижний край смещён от КРОМКИ ленты (belt_a.width=0.5, кромка
                        #     на Y=-0.25) ещё на 0.3м дальше, на высоте поверхности ленты
                        #     (Z=0 в этой системе) -> нижний край Y=-0.550, Z=0;
                        #  3. верхняя точка отклонена от вертикали на 23°, В СТОРОНУ ОТ
                        #     ЛЕНТЫ (не нависает козырьком, как в старой 2-камерной схеме).
                        # mirror_normal_deg/mirror_offset — стандартная запись плоскости
                        # (n·p=t, n=(sinφ,-cosφ)), выведены из условий 1-3 выше.
                        # mirror_bottom_edge/mirror_lean_sign — те же условия 2-3 в форме,
                        # удобной для отрисовки КОНЕЧНОЙ пластины в gen_world.py (формула
                        # "ближайшая точка плоскости к точке наблюдения", которая работала
                        # для старой симметричной схемы, для этой геометрии оказалась ВНЕ
                        # видимого полотна зеркала — использовать её для позиции пластины
                        # нельзя, см. doc §3).
                        #
                        # ВАЖНО: 2φ-θ — закон отражения НАПРАВЛЕНИЯ луча (верен только при
                        # t=0), а НЕ азимут смещённой (t≠0) зеркальной камеры от объекта —
                        # проверено на этой геометрии, расхождение ~20° (см. doc §2). Углы
                        # ниже (mirror_distance_by_angle) — TRUE azimuth (точечное
                        # отражение реальной позиции камеры через плоскость зеркала), не
                        # 2φ-θ. При этом угле формула d·v_θ и ПОВОРОТ (θ-90° вокруг X) —
                        # ТА ЖЕ формула, что у прямых камер — уже даёт камеру, направленную
                        # точно на объект (проверено эмпирически захватом кадра). Отдельное
                        # построение ориентации через reflect_dir/восстановление собственной
                        # тройки осей — было опробовано и ОТБРОШЕНО: отражение направления
                        # реальной камеры целится мимо объекта на ~1.3м (тот же класс
                        # ошибки, что 2φ-θ для азимута). Флип картинки тоже не нужен: эти
                        # cv_*_mirror камеры — обычные Webots Camera в точке, вычисленной
                        # методом мнимого изображения, а не физическая оптика зеркала
                        # (объект-зеркало ниже — декоративная пластина, Webots её оптику не
                        # моделирует) — флип актуален только для реальных фото через
                        # настоящее зеркало (roboson_tools/pose/reflect_camera_frame), не
                        # для этого синтетического рендера. Подробности и находка — заметка
                        # задачи "Рассчитать геометрию 3-камерного рига и зеркала для CV".
  x: 2.55                # было 3.70 — точка наблюдения перенесена на low, к началу ленты
                        # (см. [[Расчёт перекладки CV-зоны и ramp]])
  belt_z: 0.70           # было 0.82 — высота поверхности low-сегмента
  fov_deg: 68.0          # угол обзора вдоль ленты (оси X)
  resolution: [2592, 1944]   # [строки (вдоль ленты), столбцы (поперёк)]
  mirror_distance_by_angle:  # оптический путь камера→зеркало→объект, м (по TRUE azimuth)
    157.26: 2.5706   # top (90°) -> top_mirror
    171.95: 2.6943   # diag (70°) -> diag_mirror
  mirror_normal_deg: 113.0    # пеленг ЛИНИИ зеркала в плоскости Y-Z (от оси Y)
  mirror_offset: 0.5063  # |t|: расстояние от точки наблюдения до плоскости зеркала вдоль
                          # нормали, м (для расчёта mirror_distance_by_angle/true azimuth;
                          # НЕ использовать для позиции пластины — см. mirror_bottom_edge)
  mirror_bottom_edge: [-0.550, 0.0]   # [Y, Z] нижнего края полотна, м (условие 1-2 выше)
  mirror_tilt_from_vertical_deg: 23.0   # наклон верхней точки от вертикали (условие 3)
  mirror_lean_sign: -1   # знак направления наклона по Y при подъёме (та же сторона, что
                          # mirror_bottom_edge[0] — "в сторону от ленты")
  cameras:
    # name — имя устройства в Webots (Camera name="cv_<name>").
    # angle — азимут θ в плоскости Y-Z (0°=сбоку +Y, 90°=сверху +Z); для mirror-камер —
    #         TRUE azimuth (см. выше), не 2φ-θ.
    # distance — дистанция прямого ракурса, м (только для прямых камер).
    # mirror: true -> виртуальная камера в отражённой позиции (mirror_distance_by_angle[angle]).
    # reflects — имя прямой камеры, чьё отражение эта mirror-камера эмулирует (нужно для
    #            построения ориентации через reflect_dir, см. заметку задачи).
    top:         {angle: 90, distance: 2.000, mirror: false}   # вид сверху (прямая)
    diag:        {angle: 70, distance: 1.900, mirror: false}   # наклонная (прямая), только момент "центр"
    side:        {angle: 5,  distance: 1.100, mirror: false}   # вид сбоку (прямая), было angle:0 —
                                                                 # поднята над бортиком (см. §13 расчёта)
    top_mirror:  {angle: 157.26, mirror: true, reflects: top}    # top через зеркало
    diag_mirror: {angle: 171.95, mirror: true, reflects: diag}   # diag через зеркало
    # Выделенная камера НИЗКОГО разрешения только для непрерывного CV-триггера
    # (не для сетки ракурсов — та использует "top" в полном разрешении, как
    # раньше, кратко на сам момент). Та же позиция/ориентация, что "top"
    # (angle/distance совпадают), но узкое native-разрешение — не ds8-хак, а
    # РЕАЛЬНОЕ снижение рендера камеры, единственный работающий рычаг против
    # IPC-стоимости постоянного enable() полноразмерной камеры (Camera.getImage()
    # в Python-биндинге — не кэш, а живой запрос через границу процессов на
    # каждый вызов, см. заметку задачи). 1296 строк = 2.08мм/px (ручка 13мм →
    # ~6.2px, надёжно); 320 столбцов — только ширина ленты (0.5м) + запас
    # (±0.333м покрытие против ±0.25м рабочей полосы), не вся ширина обзора.
    # ВАЖНО: Webots привязывает fieldOfView к оси WIDTH (= n_cols, поперёк
    # ленты), а FOV оси HEIGHT (= n_rows, вдоль ленты) ВЫВОДИТСЯ из отношения
    # n_rows/n_cols: rows_fov = 2·atan(tan(fov/2)·n_rows/n_cols) (см. Webots
    # Camera reference, "Since camera pixels are squares..."). Поэтому просто
    # уменьшить n_cols при том же fov_deg=68° НЕ сужает реальный физический
    # обзор поперёк ленты — сузит только число пикселей, снимающих ТОТ ЖЕ
    # широкий кадр (проверено живым прогоном — камера показывала оба шибера,
    # далеко за пределами зоны CV). fov_deg здесь — ОТДЕЛЬНОЕ, посчитанное
    # значение (не общее 68°): даёт физическую полуширину поперёк ленты
    # 0.35м (запас над рабочей полосой ±0.25м), n_cols подобран так, чтобы
    # ВЫВЕДЕННЫЙ rows_fov остался = 68° (та же угловая геометрия вдоль ленты,
    # что у остального рига — не нужно менять формулы в build_camera_geom/
    # unproject_top_to_belt). n_rows=1296 — половина от 2592, даёт 2.08мм/px
    # вдоль ленты (ручка 13мм → ~6.2px, надёжно).
    top_track:   {angle: 90, distance: 2.000, mirror: false,
                  resolution: [1296, 336], fov_deg: 19.8525}
  mirror_size: [1.6, 0.02, 0.8]   # [длина вдоль X, толщина бруска, высота] — рамка-ориентир
                                    # (не сплошная пластина — см. cv_mirror_node; горизонтальная
                                    # ориентация 160x80см, решение пользователя 2026-07-19,
                                    # было 0.6x1.4 портретной сплошной пластиной, перекрывавшей
                                    # обзор зеркальным камерам)
  mirror_frame_bar_width: 0.03    # ширина бруска рамки, м
  background_subtraction:   # Фаза 2.1 — HSV-модель фона (изначально только
                            # прямые камеры top/diag/side, см. заметку задачи
                            # "Фоновая субтракция и маска объекта на
                            # CV-камерах"; с Фазы 3 калибруется и для
                            # top_mirror/diag_mirror — нужно для фон-сетки на
                            # все 9 ячеек, см. sim/cv_grid.py), подобрано на
                            # синтетическом рендере Webots (ровный фон ленты,
                            # мягкое освещение) — пересмотреть при переносе на
                            # реальные кадры.
    h_threshold: 15.0        # порог по тону, OpenCV H (0..179)
    s_threshold: 40.0        # порог по насыщенности, OpenCV S (0..255)
    v_threshold: 25.0        # доп. критерий "объект ЯРЧЕ фона на V" (не |ΔV| —
                              # тень темнее фона, а не ярче, см. sim/cv_localization.py);
                              # добавлено после находки на `cylinder` (нейтральный
                              # серый, почти неотличим от ленты по H/S) — эмпирически
                              # устойчиво в широком диапазоне 10-40, не «на грани»
    min_area_px: 400         # минимальная площадь компоненты — шумоподавление
    morph_kernel: 5          # ядро open/close (px)
  moment_detection:         # Фаза 2.2 — окна старт/центр/конец вдоль ленты
                            # (sim/cv_moments.py). delta_max — положение ЦЕНТРА
                            # объекта от cv_rig.x на границе безопасного окна
                            # кадра, формула roboson_tools/silhouette/
                            # camera.py::belt_offset (см. "03 Work/Расчёт
                            # перекладки CV-зоны и ramp.md" §3-4). Худший
                            # ok/round габарит по ТЗ (450×320×320мм) — не
                            # габарит конкретного объекта: категория ещё не
                            # известна на этом шаге (определяется уже ПОСЛЕ
                            # проезда зоны CV).
    margin_factor: 0.92
    worst_case_extent_x: 0.225           # половина 450мм вдоль ленты
    worst_case_transverse_radius: 0.225  # половина диагонали 320×320мм
    mask_edge_tolerance_px: 6            # допуск офлайн-детектора по маске
  grid:                     # Фаза 3 — сборка сетки 9 ракурсов (sim/cv_grid.py)
    cell_px: 900             # целевой размер стороны ячейки (native, ДО
                              # downsize под SAM3) — под этот размер
                              # подбирается ОДИН общий scale на всю сетку
                              # (см. docstring sim/cv_grid.py: crop меняет
                              # только cx/cy, resize — единый на все 9 видов).
    crop_margin_factor: 0.15  # запас вокруг bbox объекта (доля от max(w,h))
    sam3_max_dim: 1008        # уменьшенная копия под SAM3 — НЕ основной канал
                              # (classical CV/torchhull работают в native)
                                          # ("касается края кадра" на старте/конце)

diverters:              # поворотные шиберы (вертикальная ось, RotationalMotor)
  arm_length: 0.85      # было 1.15 — подобрано вживую на demo_flap_shiber.wbt (2026-07-29)
  arm_thickness: 0.03
  arm_height: 0.45          # было 0.35 — высота щита. Шлем (356мм) выше
                            # старого щита (350мм) на 6мм — цеплялся верхом за
                            # кромку и застревал. 0.45 перекрывает шлем
                            # полностью (и любой объект из objects.yaml).
  arm_tilt: 0.15        # наклон щита верхом НА объект (~8.6°): прижимает
                        # объект к ленте — исключает опрокидывание на щит и
                        # заклинивание под нижней кромкой. Круглые/длинные
                        # объекты (plate, cylinder) при вертикальном щите
                        # (tilt=0) обкатывали щит вместо соскальзывания —
                        # наклон заставляет их скатываться вниз. Было 0.11 —
                        # cylinder (длинный Ø50) всё ещё клинило у шибера B;
                        # 0.15 — сильнее прижимает, проверено на cylinder→B.
  z_bottom: 0.823       # низ щита — сразу над лентой (высокий сегмент 0.82 + 3мм).
                        # Проверялось поднятие до 0.95 (диагностика контакта с
                        # лентой как причины медленного разворота) — НЕ
                        # ПОДТВЕРДИЛОСЬ, время разворота не изменилось —
                        # вернули на исходное 3мм.
  anchor_y: 0.30        # |y| оси поворота (за краем ленты)
  deploy_angle: 0.61    # рад (35°): 30° давало слабый прижим — круглые объекты
                        # (plate) обкатывали щит и уползали за зону D по X.
                        # 35° — сильнее прижимает к -Y, но <45° (где клинит,
                        # см. README). Подобрано на ручной отладке plate→D.
                        # 40° (0.70) не помог cylinder (обкатывает фундаментально)
                        # — оставлен известным пограничным случаем.
  motor_velocity: 4.0    # рад/с — ПРОВЕРЕНО (2026-07-27): поднимали до 8.0 и
                        # экстремально до 20.0 (при ПРАВИЛЬНОЙ регенерации
                        # мира — старая пометка про "Webots ограничивает
                        # maxVelocity=4" была ложным срабатыванием: конфиг
                        # меняли, а мир не перегенерировали) — время полного
                        # разворота (0.61рад) НЕ уменьшилось, осталось
                        # ~0.4-1.0с (замер по paddle_D_sensor), при 20.0
                        # местами даже хуже/шумнее. Узкое место не в
                        # скорости/моменте мотора — что-то другое (солвер/
                        # динамика контакта щита), не диагностировано до
                        # конца. Оставлено на 4.0 — увеличение не даёт пользы.
  motor_torque: 120      # Nm — было захардкожено в gen_world.py, теперь
                        # настраивается. Проверено до 2000 (см. motor_velocity
                        # выше) — тоже не ускоряет разворот, оставлено на
                        # исходном 120.
  motor_control_pid: [200, 0, 5]   # НАЙДЕНА реальная причина медленного
                        # разворота (2026-07-28): у RotationalMotor не был
                        # задан controlPID — Webots по умолчанию берёт слабый
                        # встроенный PID [10,0,0] для позиционного управления,
                        # который НЕ успевает разогнаться до maxVelocity —
                        # то есть maxVelocity/maxTorque вообще ничего не
                        # ограничивали, разворот тормозил именно вялый PID
                        # (не мотор, не лента — оба варианта проверены и
                        # отклонены, см. историю выше). Замер в realtime-режиме
                        # (без искажений от fast-mode, где частота опроса
                        # сопоставима с самим интервалом): [10,0,0] (дефолт)
                        # → стабильно 0.4-0.5с, [200,0,5] → стабильно 0.2-0.3с,
                        # [800,0,20] → тоже ~0.2с (упирается в maxVelocity=4,
                        # 0.61/4≈0.15с теоретический предел — 200 уже
                        # достаточно, дальше PID не главный лимит).
  positions:            # side: -1 — ось справа (y<0), толкает влево к B (+y)
    B: {x: 6.45, side: -1}
    D: {x: 4.95, side: 1}
  trigger_x: 4.50        # ОБЩИЙ порог (fallback, если trigger_x_per_zone нет) —
                          # было 2.70 — переезд к D (D.x=4.95 − 0.45), предварительно,
                          # калибруется эмпирически по факту задержки CV-конвейера
                          # (см. [[Расчёт перекладки CV-зоны и ramp]])
  # Per-zone порог разворота шибера: каждый шибер поворачивается только когда
  # объект подошёл к НЕМУ (а не к общему раннему trigger_x).
  #
  # СМЕНА СТРАТЕГИИ (2026-07-27, по итогам ручной проверки пользователем):
  # раньше щит разворачивался ЗАРАНЕЕ (до прихода объекта) и работал как
  # статичная наклонная направляющая — объект наезжал на уже развёрнутый щит
  # и скользил/катился вдоль него под действием трения ленты. Для круглых
  # объектов (шлем, катящийся цилиндр) это ненадёжно — они обкатывают
  # направляющую вместо соскальзывания (см. историю arm_tilt/deploy_angle
  # выше). Пользователь вручную проверил другой режим: если разворачивать
  # щит РЕЗКО, когда объект уже подъехал близко к самому щиберу (не заранее),
  # получается не направляющая, а точечный УДАР — щит сталкивает объект вбок
  # импульсом, а не ведёт его трением. Это надёжно сработало и на шлеме
  # (шаре), и на цилиндре. Порог ниже поэтому сдвинут С УПРЕЖДЕНИЯ (было
  # position.x − 0.15/0.45, щит успевал развернуться ДО объекта) НА середину
  # самого щита (position.x + arm_length/2 — центр полотна в его собственной
  # системе, см. paddle_node в tools/gen_world.py): разворот стартует, когда
  # объект уже практически у щита, и заканчивается (0.61рад / 4.0рад/с ≈
  # 0.15с) пока объект ещё в зоне охвата полотна (~0.94м в развёрнутом виде,
  # см. divert_safe_radius ниже) — щит "догоняет" объект резким взмахом.
  # Возврат щита — см. release_enter (тоже резкий, не ждёт полного долёта
  # до бокса зоны). Числа ниже — первое приближение по геометрии, подлежат
  # эмпирической проверке на шлеме/цилиндре (см. заметку задачи).
  trigger_x_per_zone:
    B: 6.75                  # B.x=6.45 + 0.30 (было 6.85=+0.40 — расширенный
                          # A/B (30-60 повторов на офсет, воспроизводимые
                          # розыгрыши) дал +0.30 чуть лучше +0.40 на D:
                          # 49/60 (81.7%) против 48/60 (80%), оба заметно
                          # лучше +0.60/+0.80 — плато 0.30-0.40, +0.30 выбран
                          # как пиковое значение).
    D: 5.25                  # D.x=4.95 + 0.30 — см. полный A/B ниже:
                          # +0.20→46/60(76.7%), +0.30→49/60(81.7%, лучший),
                          # +0.40→48/60(80%), +0.60→42/60(70%), +0.80→46/60(76.7%).
                          # Воспроизводимость через rotation в событии "spawn",
                          # replay POST /api/spawn {"rotation":[rx,ry,rz,angle]}.
                          # ПРИЧИНА исходной калибровки: разворот щита
                          # реально занимает ~0.4-0.6с (измерено по датчику
                          # paddle_D_sensor от команды до deploy_angle*0.98),
                          # а НЕ ~0.15с, как считалось раньше (0.61рад/4.0рад/с
                          # — теоретическая оценка при мгновенном выходе на
                          # maxVelocity; фактически щит гораздо дольше выходит
                          # на скорость/преодолевает сопротивление). За это
                          # время объект (1 м/с) проезжает 0.4-0.6м — при
                          # позднем триггере (+0.60/+0.80) объект часто уже
                          # почти миновал щит к концу разворота, контакт
                          # получается скользящим (щит "направляет", а не
                          # "сматывает" — ровно то, что заметил пользователь
                          # вручную). Раньше запускать взмах — надёжнее.
  divert_safe_radius: 1.35  # защита от перехвата: шибер зоны НЕ разворачивается,
                          # пока есть объект ДРУГОЙ зоны с x < divert.x + радиус
                          # (ещё не проехал шибер). Иначе при частом спавне шибер
                          # D, разворачиваясь для своего D-объекта, перехватывает
                          # B/C-объект, физически проезжающий точку D (D ближе к
                          # спавну, чем B). Было 0.30 — измерено живым прогоном
                          # (см. заметку задачи "Тайминг шиберов B/D"): щит D в
                          # разложенном виде — диагональная панель от (ax,ay) до
                          # (ax + arm_length·cos(deploy_angle), ay − arm_length·
                          # sin(deploy_angle)) = физически перекрывает x от 4.95
                          # до ~5.89 ПО ВСЕЙ ширине ленты, а не узкую полоску у
                          # оси. При radius=0.30 (граница x=5.25) цилиндр на
                          # x≈5.6–5.7 в момент срабатывания уже считался
                          # "проехавшим", хотя физически ещё под щитом — уезжал
                          # в D вместо B. ВАЖНО: сам по себе больший радиус не
                          # решает проблему — нужен ЕЩЁ и порядок обработки
                          # объектов в Router.step() (см. _other_zone_object_
                          # near_divert и on_belt_uids-снимок ниже в router.py):
                          # без снимка на начало такта D и B срабатывали в ОДИН
                          # и тот же такт на одном объекте независимо от
                          # radius — щиты толкали его в противоположные стороны,
                          # объект улетал мимо обеих зон. С исправленным
                          # порядком 1.00 (граница x=5.95) даёт D сработать и
                          # завершить разворот НЕЗАДОЛГО ДО того, как тот же
                          # объект достигнет trigger_x_per_zone.B=6.00 — т.е.
                          # действия щитов разнесены по времени, а не совпадают.
                          # 1.20 (граница x=6.15, ЗА порогом B) пробовали — при
                          # этом D срабатывает, когда B уже раскрывается, и оба
                          # щита оказываются одновременно в движении на одном
                          # такте: цилиндр (и без того погранично держащийся на
                          # щите B — см. arm_tilt выше) застревал и требовал
                          # nudge, иногда до stall_giveup. С фиксом порядка
                          # radius=1.00 (граница x=5.95) убрал одновременный
                          # разворот, но цилиндр ВСЁ РАВНО стабильно (8/8)
                          # застревал у B: позиция объекта — это ЦЕНТР МАСС
                          # (node.getPosition()), а не край. cylinder — box
                          # 0.435×0.050×0.050 (см. objects.yaml), половина
                          # длины 0.2175м — сопоставима с самим запасом. При
                          # радиусе 1.00 центр цилиндра уже считался "проехавшим",
                          # а его ЗАДНЯЯ половина (центр − 0.2175) физически
                          # ещё была в зоне охвата щита D — задевало по касательной,
                          # сбивало ориентацию/скорость перед самым B. 1.35
                          # (граница x=6.30) = запас под щит D (~0.94) + под
                          # длину цилиндра (0.2175, худший габарит категории ok
                          # на этом участке) + допуск. Проверить живым прогоном.
                          # Защита (_other_zone_object_near_divert) РАСПРОСТРАНЕНА
                          # и на щит B (раньше — только D, обоснование "B —
                          # последний щит, некого перехватывать" было неверным:
                          # C-объекты без своего щита физически проезжают мимо
                          # оси B по пути в C; живой прогон — pouf(C, Ø489мм)
                          # едет перед cylinder(B), щит B задевал пуфик).
                          # divert_safe_radius общий для обоих щитов: граница
                          # x=6.45+1.35=7.80 у B ровно совпадает с zones.C.enter
                          # (x>=7.80) — к моменту, когда B получает право
                          # развернуться, C-объект уже гарантированно зашёл в
                          # свою зону.
  # release_enter — резкий возврат щита (см. смену стратегии выше на удар,
  # а не направляющую): раньше (Y-порог D:[y,"<=",-0.15]) освобождение
  # ЛОМАЛО доставку (0/8 helmet, объект уезжал в C/B) — щит в старой
  # стратегии был НАПРАВЛЯЮЩЕЙ и объект зависел от него всё время полёта до
  # бокового смещения. При ударе объект уже получил боковой импульс и едет
  # сам — щит можно убирать по X (проехал зону охвата полотна), а не ждать
  # бокового Y-смещения. Порог = position.x + arm_length·cos(deploy_angle)
  # (кромка полотна в развёрнутом виде, см. divert_safe_radius выше: ~0.94м
  # для deploy_angle=0.61) — щит держится ровно на время удара, не дольше.
  # Первое приближение — проверить живым прогоном на шлеме/цилиндре.
  release_enter:
    D: [x, ">=", 5.90]
    B: [x, ">=", 7.40]
  release_timeout_s: 45.0  # увеличено: путь до зоны B теперь длиннее (раструб + лента B)
  nudge_after_s: 1.0    # объект замер у шибера -> пошевелить щит (чаще: без наклона щита толчок слабее)
  nudge_angle: 0.15     # амплитуда, рад
  max_nudge_count: 6    # лимит нуджей на объект — после ждём missed по release_timeout_s
  zone_clear_threshold: 3   # при накоплении >3 доставленных товаров в зоне C/D
                          # самый старый удаляется из мира (как B). Без этого
                          # ролл-кейджи переполняются физическими телами — ODE
                          # каждый такт строит контакты для всех лежащих товаров,
                          # нагрузка растёт, симуляция тормозит и крашится при
                          # частом спавне (0.7с). Замороженные (_freeze) тела
                          # тоже считаются — physics убран, но boundingObject
                          # остаётся, контакты строятся.

belt_b:                 # приёмный конвейер зоны B — перпендикулярно ленте A
  width: 0.5
  height: 0.70
  speed: 1.0
  x_center: 7.250        # центр по X (совпадает с узкой частью раструба)
  y_start: 0.600         # стык с раструбом
  y_end: 2.500

zone_b_chute:            # статический раструб перед лентой B (без привода, скольжение)
  y_start: 0.255          # 5мм от края ленты A
  y_end: 0.600
  height_start: 0.82      # совпадает с высоким сегментом ленты A
  height_end: 0.70        # совпадает с высотой ленты B
  x_right: 7.500          # правая стенка прямая по всей длине зоны B (255 -> 2500)
  width_start: 1.200      # ширина раструба у входа (пол = ширина стенок, без расширения)
  width_end: 0.500        # ширина после сужения (= ширина ленты B)

roll_cage:               # ролл-кейджи (1200x800x800 мм)
  length: 1.2
  width: 0.8
  height: 0.8
  # 0.02 давало туннелинг: товар входит у верха стенки (~z=0.8) и падает до
  # дна (~z=0.15) свободным падением ~0.65м, скорость удара ~3.6 м/с — при
  # шаге физики 8мс смещение за такт (~2.9см) превышало толщину дна, и ODE
  # иногда не успевала зафиксировать контакт (дискретная коллизия, не
  # зависит от массы). 0.08 даёт запас x2.7 от порога туннелинга; верх дна
  # (z=floorHeight) не меняется — RollCage.proto растит плиту дна вниз.
  wall_thickness: 0.08
  positions:
    # C — негабарит: в конце ленты A, на той же оси (Y=0), ловит товар "в лоб".
    # closed: true -> все 4 стенки (лента A выше стенки на 20мм, товар
    # проезжает над кромкой по инерции и падает внутрь).
    C: {x: 8.155, y: 0.0, yaw: 3.14159, closed: true}
    # D — доупаковка: сбоку от ленты A (снизу, -Y).
    # closed: true — 4 стенки по требованию (вид приёмного бокса).
    # Боковой заезд шибером цеплялся за кромку 4-й стенки (в отличие от C,
    # где заезд прямой и объект перелетает стенку по инерции) — компенсируем
    # козырьком d_entry_ramp ниже.
    D: {x: 5.600, y: -0.72, yaw: 1.5708, closed: true}

d_entry_ramp:            # наклонный козырёк-скат над 4-й (входной) стенкой
                         # кейджа D — только над самой стенкой, не заходит
                         # вглубь бокса (иначе мешает вывозить кейдж). x-диапазон
                         # (по всей длине бокса, за вычетом боковых стенок)
                         # считается в gen_world.py из roll_cage/positions.D.
                         #
                         # Подбирайте наклон здесь через y_end/z_end:
                         #   - входная стенка D (текущие positions.D/roll_cage):
                         #     y от -0.34 (внутр. грань) до -0.32 (внешн. грань),
                         #     верх стенки z = 0.80.
                         #   - y_end должен быть НЕ ГЛУБЖЕ ~-0.36..-0.40 (чуть за
                         #     стенкой) — глубже скат уже перекрывает объём бокса
                         #     и мешает его вывозить.
                         #   - z_end должен быть НЕ НИЖЕ 0.80 (верх стенки) —
                         #     ниже скат "утонет" в стенке.
  y_start: -0.25         # кромка ленты A (= -belt_a.width / 2), не менять
  z_start: 0.814         # вровень с лентой, не менять
  y_end: -0.32           # <- подобрать (конец ската по Y)
  z_end: 0.805           # <- подобрать (высота ската в конце, >= 0.80)
  thickness: 0.005

zones:                  # области фиксации доставки — засчитывается по факту
                         # пересечения стенки бокса/лотка, прилегающей к
                         # конвейеру (enter: ось, порог), в пределах её
                         # ширины (lateral: ось, lo, hi). Высота намеренно не
                         # проверяется: иначе штабель товаров в одном боксе
                         # не даёт верхним засчитаться, хотя они уже на месте.
  B: {enter: [y, ">=", 1.60], lateral: [x, 7.00, 7.50]}
  C: {enter: [x, ">=", 7.80], lateral: [y, -0.55, 0.55]}
  D: {enter: [y, "<=", -0.33], lateral: [x, 5.20, 6.00]}   # было [3.95,5.25] —
                          # устаревшее: кейдж D (x=5.60,width=0.8,yaw=90°) занимает
                          # x∈[5.20,6.00]. Раньше фиксация заканчивалась на x=5.25,
                          # а объекты физически падали в кейдж на x=5.6-5.9 — доставка
                          # не засчитывалась (plate на x=5.70,y=-0.37 был В кейдже, но
                          # вне lateral). Приведено к реальной геометрии кейджа D.

http:
  port: 8008            # панель управления и API
  stream_port: 1234     # streaming-сервер Webots (x3d)

physics:
  basic_time_step_ms: 8
  object_density_kg_m3: 200  # ЕДИНАЯ плотность для Physics{density} всех товаров —
                        # масса больше не подгоняется вручную по объекту (было
                        # 0.03..5.0 кг "на глаз" в objects.yaml), Webots считает
                        # mass/centerOfMass/inertiaMatrix сам из объёма реальной
                        # convex-decomposed коллизии (см. sim/collision.py,
                        # tools/prepare_collision.py) при заданной плотности.
                        # 200 кг/м³ — грубая прикидка под лёгкие полые товары
                        # (короба, бутылки, шлем), единственная сохранившаяся
                        # физическая подгонка на весь набор, а не 16 отдельных.
  paddle_friction: 0.01 # гладкий щит шибера: объект скользит вдоль него.
                        # Было 0.05 — круглые товары (шлем) обкатывали щит и
                        # застревали. 0.01 (почти нулевое трение скольжения) —
                        # объект легко соскальзывает в нужную сторону по
                        # наклонённому щиту. Подобрано под helmet→D.
