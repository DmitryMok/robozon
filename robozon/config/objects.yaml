# Типы объектов симуляции.
# category — известная категория типа (этап 1, без CV):
#   ok       -> зона B (подходит для сортировки: 10x10x10 < габариты < 450x320x320, не круглый)
#   oversize -> зона C (габариты <= 10x10x10 мм ЛИБО >= 450x320x320 мм, приоритет над формой)
#   round    -> зона D (круглая проекция: k = r_впис/R_опис по выпуклой оболочке проекции >= 0.8,
#               поиск по методу G4 — 3 PCA-оси + 3 диагонали + локальный поиск для погранично
#               неуверенных случаев; см. `roboson_tools/core/experiment.py::check_model_roll_g4`)
# Категории 16 объектов ниже — прогон реального G4 (roundness_threshold=0.8, дефолт),
# не "на глаз"; для 3 из 11 исходных объектов это изменило категорию против более ранней
# ручной разметки (см. [[План CV-пайплайна сортировки (Webots)]], Фаза 0):
#   bag: ok -> round (G4 нашёл ось с k=0.921, выше порога — реально круглая проекция)
#   cylinder: round -> ok (несмотря на название, G4 не нашёл оси с k>=0.8 — известный
#             пограничный тестовый объект, см. `Ограничения.md` §3)
#   pen: ok -> oversize (баг: MIN_DIMS в tools/prepare_stl.py был 10x10x2 вместо 10x10x10
#        по ТЗ — сторона 9мм < 10мм, исправлено)
# bounding — ТОЛЬКО эвристика формы для трения/демпфирования/фильтра
#   ориентации при спавне (is_cylinder/is_roller, sim/collision.py comment).
#   Реальная форма коллизии (boundingObject) и масса больше НЕ отсюда — это
#   ручная подгонка под конкретные 16 STL, не переносится на новые STL от
#   организаторов (см. пример cylinder/helmet ниже). Вместо этого —
#   автоматическая convex decomposition прямо по STL
#   (tools/prepare_collision.py, кэш assets/collision/) + масса из объёма
#   этой формы при ЕДИНОЙ плотности (config/layout.yaml: physics.object_density_kg_m3).
#   box: size [x,y,z]; cylinder: radius, height, axis (x|y|z — ориентация оси).
# Габариты см. вывод tools/prepare_stl.py.

objects:
  box_small:
    label: "Короб 300×200×200"
    category: ok
    color: [0.80, 0.62, 0.38]
    bounding: {type: box, size: [0.301, 0.201, 0.200]}

  lunchbox:
    label: "Ланчбокс"
    category: ok
    color: [0.36, 0.65, 0.85]
    bounding: {type: box, size: [0.201, 0.062, 0.152]}

  detergent:
    label: "Моющее средство"
    category: ok
    color: [0.90, 0.45, 0.15]
    bounding: {type: box, size: [0.259, 0.278, 0.179]}

  bag:
    label: "Мешок"
    category: round          # G4: k=0.921 (ось найдена локальным поиском), реально круглая проекция
    color: [0.55, 0.50, 0.42]
    bounding: {type: box, size: [0.183, 0.175, 0.199]}

  pen:
    label: "Ручка"
    category: oversize        # 9мм < 10мм минимума по ТЗ (148×13×9)
    color: [0.20, 0.25, 0.70]
    bounding: {type: box, size: [0.148, 0.013, 0.009]}

  box_large:
    label: "Короб 400×400×300"
    category: oversize      # 400 > 320 по двум осям
    color: [0.72, 0.52, 0.28]
    bounding: {type: box, size: [0.401, 0.300, 0.400]}

  pouf:
    label: "Пуфик"
    category: oversize      # Ø489 > 450; круг в сечении тоже есть, но приоритет — габариты
    color: [0.60, 0.30, 0.55]
    bounding: {type: cylinder, radius: 0.245, height: 0.264, axis: z}

  bottle:
    label: "Бутылка"
    category: round         # r/R = 1.00
    color: [0.25, 0.60, 0.30]
    bounding: {type: cylinder, radius: 0.046, height: 0.305, axis: y}

  plate:
    label: "Тарелка"
    category: round         # r/R = 1.00
    color: [0.90, 0.88, 0.82]
    bounding: {type: cylinder, radius: 0.105, height: 0.027, axis: z}

  cylinder:
    label: "Цилиндр"
    category: ok            # G4: k=0.756, не находит оси >=0.8 — известный пограничный тест
                             # (низкополигональный меш, см. Ограничения.md §3); несмотря на
                             # название не круглый по строгому критерию ТЗ
    color: [0.55, 0.57, 0.60]
    # bounding — BOX (не cylinder): длинный круглый цилиндр (435×Ø50) обкатывает
    # щит — катится по ленте вдоль щита, не соскальзывает вбок, застревает у B.
    # Box с плоскими гранями скользит по ленте (traverse friction 1.2), щит
    # толкает его вбок — падает в зону, как коробка. Габариты — охватывающий
    # бокс цилиндра Ø50×435 (axis=x -> вдоль ленты).
    bounding: {type: box, size: [0.435, 0.050, 0.050]}

  helmet:
    label: "Шлем"
    category: round         # G4: k=0.869 на диагональной оси (не на главных PCA-осях,
                             # k=0.78) — иллюстративный пример категории D из самой Постановки
                             # задачи (раздел «Не подходит для сортировки без доупаковки»)
    color: [0.85, 0.15, 0.15]
    # bounding — SPHERE: реальный шлем круглый (k=0.869), шар катится в любую
    # сторону — щит направляет его в зону, не застревает (цилиндр на донышке —
    # диск, который не катится вбок; цилиндр на боку катится только вдоль оси).
    # radius 0.16 — между radius цилиндра (0.148) и half-height (0.178),
    # компромисс: охватывает большую часть шлема, катится свободно.
    bounding: {type: sphere, radius: 0.16}
    roller: true
    # коробов — сейчас у него то же трение скольжения (0.9), что и у
    # коробок (ось z у is_roller не даёт заниженного contactMaterial
    # "round" — та ветка снижает только rollingFriction, не помогает
    # прижатому к бортику объекту соскользнуть). Отдельный материал
    # "slippery" со сниженным coulombFriction — см. object_node()/gen_world.py.
    slippery: true

  asym_barrel:
    label: "Асимметричная бочка"
    category: round          # G4: k=0.831
    color: [0.62, 0.40, 0.20]
    bounding: {type: box, size: [0.120, 0.225, 0.120]}

  asym_cone:
    label: "Асимметричный конус"
    category: round          # G4: k=0.973
    color: [0.30, 0.55, 0.75]
    bounding: {type: box, size: [0.100, 0.100, 0.200]}

  asym_cyl:
    label: "Асимметричный цилиндр"
    category: ok             # G4: k=0.702, не находит оси >=0.8 после локального поиска
    color: [0.45, 0.65, 0.40]
    bounding: {type: box, size: [0.060, 0.300, 0.060]}

  cyl_skewed:
    label: "Скошенный цилиндр"
    category: ok             # G4: k=0.771, не находит оси >=0.8 после локального поиска
    color: [0.70, 0.45, 0.60]
    bounding: {type: box, size: [0.170, 0.296, 0.203]}

  ell_cyl:
    label: "Эллиптический цилиндр"
    category: round          # G4: k=0.970
    color: [0.80, 0.70, 0.25]
    bounding: {type: box, size: [0.132, 0.300, 0.132]}
